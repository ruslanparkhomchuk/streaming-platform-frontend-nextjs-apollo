query FindChannelByUsername($username: String!) {
	findChannelByUsername(username: $username) {
		id
		displayName
		username
		avatar
		bio
		isVerified
		socialLinks {
			id
			title
			url
		}
		stream {
			title
			thumbnailUrl
			isLive
			category {
				title
			}
		}
		sponsorshipPlans {
			id
			title
			description
			price
		}
		followers {
			id
		}
	}
}
